<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بطاقة إضافة رابط المنتج</title>
  <style>
    :root {
      --blue: #0757d5;
      --navy: #071b49;
      --muted: #6d85af;
      --surface: #ffffff;
      --canvas: #f4f8fe;
      --border: #e1e8f2;
      --soft-blue: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--canvas);
      font-family: Tahoma, Arial, sans-serif;
      color: var(--navy);
    }
    .link-card {
      width: min(100%, 520px);
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 16px 36px rgba(7, 27, 73, .08);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }
    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 5px var(--soft-blue);
    }
    h2 { margin: 0; font-size: 22px; line-height: 1.35; }
    .description {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .input-row {
      display: flex;
      gap: 10px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fbfdff;
      transition: .2s ease;
    }
    .input-row:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(7, 87, 213, .10);
    }
    input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      padding: 0 12px;
      background: transparent;
      color: var(--navy);
      font: inherit;
      font-size: 13px;
      direction: ltr;
      text-align: left;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      min-height: 46px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(7, 87, 213, .20);
    }
    button:hover { background: #064bb8; }
    .hint {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 12px 4px 0;
      color: var(--muted);
      font-size: 11px;
    }
    .hint svg { flex: 0 0 auto; }
  </style>
</head>
<body>
  <section class="link-card" aria-label="إضافة رابط منتج">
    <div class="eyebrow">تسوق عالمي أسهل</div>
    <h2>لديك رابط منتج؟ أرسله لنا</h2>
    <p class="description">سنراجع المنتج ونرسل لك التكلفة النهائية مع الشحن والرسوم قبل تأكيد الطلب.</p>
    <form class="input-row" onsubmit="event.preventDefault()">
      <input type="url" placeholder="https://example.com/product" aria-label="رابط المنتج" required />
      <button type="submit">متابعة</button>
    </form>
    <div class="hint">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 10v6m0-9h.01"/></svg>
      يدعم روابط Amazon وSHEIN وAliExpress وAlibaba
    </div>
  </section>
</body>
</html>
